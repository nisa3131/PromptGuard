services:
  api:
    build: ./backend
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      PROMPTGUARD_API_KEY: ${PROMPTGUARD_API_KEY:?Set PROMPTGUARD_API_KEY in .env}
      PROMPTGUARD_DB: /data/promptguard.sqlite3
      PROMPTGUARD_MODEL_PATH: /srv/models/promptguard_baseline.joblib
    volumes:
      - promptguard_data:/data
      - ./ml/models:/srv/models:ro
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:3001:80"
    depends_on:
      - api
volumes:
  promptguard_data:
